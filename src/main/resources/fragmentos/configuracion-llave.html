<section class="seccion-cambio-llave" aria-labelledby="cambio-llave-seccion-titulo">
    <h2 class="solo-lectores" id="cambio-llave-seccion-titulo">Seguridad del hotel</h2>
    <button class="opcion-cambio-llave opcion-cambio-llave--requerida" id="abrir-cambio-llave"
            type="button" aria-haspopup="dialog" aria-controls="modal-cambio-llave">
        <span class="opcion-cambio-llave__simbolo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 3a6 6 0 0 0-5.5 8.4L2 19v3h4v-3h3v-3l3.6-3.5A6 6 0 1 0 15 3Z"/><circle cx="16" cy="7" r="1.4"/></svg></span>
        <span class="opcion-cambio-llave__contenido">
            <span class="opcion-cambio-llave__estado">Configuración requerida</span>
            <span class="opcion-cambio-llave__titulo">Cambio de llave de acceso</span>
            <span class="opcion-cambio-llave__descripcion">
                Protege el acceso del establecimiento con una llave propia y segura.
            </span>
        </span>
        <span class="opcion-cambio-llave__accion">Configurar <span aria-hidden="true">→</span></span>
    </button>
</section>

<dialog class="modal-hotel modal-cambio-llave {{CLASE_MODAL_CAMBIO_LLAVE}}" id="modal-cambio-llave"
        aria-modal="true" aria-labelledby="modal-cambio-llave-titulo"
        aria-describedby="modal-cambio-llave-descripcion">
    <div class="modal-hotel__contenido">
        <button class="modal-hotel__cerrar" type="button" data-cerrar-cambio-llave
                aria-label="Cerrar cambio de llave">×</button>
        <span class="modal-hotel__simbolo" aria-hidden="true">✦</span>
        <p class="sobrelinea">SEGURIDAD DEL HOTEL</p>
        <h2 id="modal-cambio-llave-titulo">Crea una nueva llave</h2>
        <p id="modal-cambio-llave-descripcion">
            La nueva llave reemplazará la utilizada para ingresar a este hotel.
        </p>
        {{FORMULARIO_CAMBIO_LLAVE}}
    </div>
</dialog>
